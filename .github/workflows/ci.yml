name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  test:
    name: Syntax & Build Validation
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify PowerShell Syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path . -Recurse -Filter "*.ps1" | Where-Object { $_.FullName -notmatch '\\\.git\\' }
          $failed = $false
          foreach ($s in $scripts) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$tokens, [ref]$errors)
              if ($errors -and $errors.Count -gt 0) {
                  $failed = $true
                  Write-Error "[FAIL] Syntax error in $($s.FullName) ($($errors.Count) errors)"
                  $errors | ForEach-Object { Write-Host "  Line $($_.Extent.StartLineNumber): $($_.Message)" }
              } else {
                  Write-Host "[PASS] $($s.FullName.Replace((Get-Location).Path, ''))" -ForegroundColor Green
              }
          }
          if ($failed) { exit 1 }

      - name: Test Native Compilation
        shell: pwsh
        run: |
          .\scripts\build-exe.ps1
          if (-not (Test-Path "TunnelKeeper.exe")) {
              Write-Error "Failed to compile TunnelKeeper.exe!"
              exit 1
          }
          Write-Host "TunnelKeeper.exe compiled cleanly." -ForegroundColor Green
